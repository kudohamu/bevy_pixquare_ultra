name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.94.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up space in github runner
        run: sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true; sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm || true; echo "some directories deleted"
        shell: bash
        if: runner.os == 'linux'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.94.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.94.0-

      - parallel:
          - name: Check formatting
            run: cargo fmt --all -- --check

          - name: Run Clippy
            run: cargo clippy --all-targets --all-features --locked -- -D warnings

          - name: Run tests
            run: cargo test --all-features --locked

          - name: Build documentation
            env:
              RUSTDOCFLAGS: -D warnings
            run: cargo doc --no-deps --all-features --locked
