[package]
name = "bevy_pixquare_ultra"
version = "0.1.0"
edition = "2024"
authors = ["kudohamu"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
  "bevy_asset",
  "bevy_image",
  "bevy_log",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
] }
pixquare-io = { path = "../pixquare-io" }

[dev-dependencies]
bevy = { version = "0.18", features = [
  "bevy_window"
] }
bevy_asset_loader = "0.26.0"

[features]
3d = ["bevy/bevy_pbr"]

[[example]]
name = "material3d"
path = "examples/material3d.rs"
required-features = ["3d"]
