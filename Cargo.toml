[package]
name = "bevy_pixquare_ultra"
version = "0.1.0"
edition = "2024"
authors = ["kudohamu"]
description = "A bevy plugin to load and render artwork data of Pixquare"
repository = "https://github.com/kudohamu/bevy_pixquare_ultra"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "gamedev", "pixquare", "pixel-art", "animation"]
categories = ["game-development", "graphics"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
  "bevy_asset",
  "bevy_image",
  "bevy_log",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
] }
image = { version = "0.25.6", default-features = false, features = ["qoi"], optional = true }
pixquare-io = { version = "0.1.0" }
rmp-serde = { version = "1.3.1", optional = true }
ron = { version = "0.12.2", optional = true }
serde = { version = "1.0.218" }

[dev-dependencies]
bevy = { version = "0.18", features = [
  "bevy_window"
] }
bevy_asset_loader = "0.26.0"

[features]
3d = ["bevy/bevy_pbr"]
asset_processing = [
  "bevy/asset_processor",
  "bevy/qoi",
  "dep:image",
  "dep:rmp-serde"
]
atlas_asset = [
  "dep:ron"
]

[[example]]
name = "material3d"
path = "examples/material3d.rs"
required-features = ["3d"]

[[example]]
name = "asset_processing"
path = "examples/asset_processing.rs"
required-features = ["asset_processing"]

[[example]]
name = "texture_atlas_from_asset"
path = "examples/texture_atlas_from_asset.rs"
required-features = ["atlas_asset"]

[lints.clippy]
type_complexity = "allow"
